<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#F5F8F7}</style></head><body>
<title>建設会社向け プロジェクトハブ（デモ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F8F7; --surface:#FFFFFF; --ink:#1C2826; --muted:#5D6D6A; --line:#DAE3E1;
  --teal:#0F5C57; --teal-soft:#E3EEEC; --amber:#B85E22; --amber-soft:#F7E6D8;
  --red:#B3262E; --red-soft:#F8E1E2; --green:#2C7A4B; --green-soft:#E1F1E7;
  --shadow:0 1px 2px rgba(15,40,38,.06),0 4px 14px rgba(15,40,38,.05);
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --p-bg:#120F1A; --p-surface:#1B1726; --p-raise:#231E31; --p-line:#322B45; --p-ink:#EEE9F6; --p-muted:#A69EBA;
  --p-gold:#D9B36C; --p-rose:#E7849A; --p-teal:#62C6B7; --p-warn:#E9B04F;
  --rc-bg:#FFFFFF; --rc-ink:#1A1424; --rc-muted:#6B6478; --rc-line:#CFC9DA;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
.num,.tab{font-variant-numeric:tabular-nums}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .in{max-width:1160px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto;min-width:0}
.brand b{font-size:15px}
.brand span{font-size:12px;color:var(--muted)}
.switch{display:flex;background:var(--teal-soft);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;color:var(--teal)}
.switch button[aria-pressed="true"]{background:var(--teal);color:#fff}
.who{font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px}
@media (max-width:600px){.appbar{position:static}}
.demo{background:var(--amber-soft);color:var(--ink);font-size:13px;text-align:center;padding:6px 16px}
.demo b{color:var(--amber)}

/* hub */
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px}
.hero{padding-block:28px 8px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--teal);font-weight:700;margin:0}
.hero h1{font-size:clamp(24px,3.4vw,32px);margin-top:4px}
.hero .parties{color:var(--muted);font-size:14px;margin:6px 0 0}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:16px;display:grid;gap:6px}
.lead p{margin:0}
.privacy{font-size:13px;color:var(--red);background:var(--red-soft);border-radius:8px;padding:6px 10px;justify-self:start}
.small{font-size:13px}.muted{color:var(--muted)}
.sec{padding-block:26px 6px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.sec-head .n{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.sec-head h2{font-size:20px}
.sec-head .aside{margin-left:auto;font-size:13px}
.sec-desc{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}

.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.app{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.app:hover{border-color:var(--teal)}
.app .t{font-weight:700}
.app .d{font-size:13px;color:var(--muted)}

.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.p-live{background:var(--green-soft);color:var(--green)}
.p-proto{background:var(--amber-soft);color:var(--amber)}
.p-prep{background:var(--teal-soft);color:var(--teal)}
.p-hi{background:var(--red-soft);color:var(--red)}
.p-mid{background:var(--amber-soft);color:var(--amber)}
.p-lo{background:var(--teal-soft);color:var(--teal)}
.p-fix{background:var(--teal);color:#fff}

.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dept{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.dept:hover{border-color:var(--teal)}
.dept h3{font-size:17px}
.dept dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.dept dt{color:var(--muted)}.dept dd{margin:0}
.bar{height:6px;border-radius:99px;background:var(--teal-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.dept .go{font-size:13px;color:var(--teal);font-weight:700}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.done{color:var(--muted);text-decoration:line-through}
.linkbtn{border:0;background:none;color:var(--teal);cursor:pointer;padding:0;font-weight:700;font-size:13px}
.btn{border:0;background:var(--teal);color:#fff;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn.sm{padding:4px 10px;font-size:13px}

.gantt{min-width:640px}
.g-row{display:grid;grid-template-columns:200px repeat(6,1fr);align-items:center;border-bottom:1px solid var(--line);min-height:38px}
.g-row:last-child{border-bottom:0}
.g-row .lbl{font-size:13px;padding:6px 10px;min-width:0}
.g-head{font-size:12px;color:var(--muted);font-weight:700;background:var(--bg)}
.g-head div{padding:6px 8px}
.g-cell{position:relative;height:38px;border-left:1px dashed var(--line)}
.g-bar{position:absolute;top:11px;height:16px;border-radius:5px;background:var(--teal)}
.g-want{position:absolute;top:8px;width:3px;height:22px;background:var(--amber);border-radius:2px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:6px 0 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

.feed{display:grid;gap:10px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:4px}
.post .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.post .t{font-weight:700}
.post p{margin:0;white-space:pre-wrap}
.post.bear{background:var(--teal-soft);border-color:transparent}
form.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;margin-top:12px}
.field{display:grid;gap:4px;font-size:13px;min-width:0}
.field>span{color:var(--muted);font-weight:500}
input[type=text],input[type=month],input[type=search],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 200px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:14px}
.seg input{accent-color:var(--teal)}
.docs{list-style:none;margin:0;padding:0;display:grid}
.docs li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.docs li:last-child{border-bottom:0}
.docs .kind{font-size:12px;color:var(--muted);width:60px}
.docs button{border:0;background:none;color:var(--ink);cursor:pointer;text-align:left;padding:0;font-weight:500;flex:1;min-width:0}
.docs button:hover{color:var(--teal)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.contact{grid-template-columns:1fr}}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow code{font-family:inherit;background:var(--bg);border:1px solid var(--line);padding:2px 8px;border-radius:6px;user-select:all}
.users{display:grid;gap:8px}
.user{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.user:last-child{border-bottom:0}
.user .nm{font-weight:700;min-width:7em}

/* dept view */
.back{border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer;padding:0;margin-top:20px}
.dept-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-top:14px}
@media (max-width:860px){.dept-grid{grid-template-columns:1fr}}
.dept-grid h2{font-size:18px;margin-bottom:8px}
.dept-grid h3{font-size:15px;margin:16px 0 6px}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.mini li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
footer.hubfoot{margin-top:36px;padding-block:22px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}

@media (prefers-reduced-motion:no-preference){.app,.dept,.btn{transition:border-color .15s,background .15s}}

/* site app */
.site{padding-bottom:40px}
.site table{min-width:720px}
.site td{white-space:nowrap}
#hub table{min-width:640px}
.s-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:16px;overflow-x:auto}
.s-tabs button{border:0;background:none;color:var(--muted);padding:10px 16px;cursor:pointer;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.s-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber);font-weight:700}
.s-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:18px}
.s-head h2{font-size:20px;margin-right:auto}
.s-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.s-filters select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kp .k{font-size:12px;color:var(--muted)}
.kp .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.kp.warn .v{color:var(--red)}
.st-sel{border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;border:1px solid var(--line);width:auto}
.st-未依頼{background:var(--bg);color:var(--muted)}
.st-依頼済み{background:var(--amber-soft);color:var(--amber)}
.st-是正中{background:var(--red-soft);color:var(--red)}
.st-是正済み{background:var(--green-soft);color:var(--green)}
.nip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
@media (max-width:820px){.nip{grid-template-columns:1fr}}
.phone{max-width:420px;width:100%;justify-self:center;border:10px solid #22302E;border-radius:28px;background:var(--surface);overflow:hidden}
.phone .ph-top{background:var(--teal);color:#fff;padding:10px 14px;font-weight:700;font-size:14px}
.phone form{border:0;margin:0;border-radius:0}
input[type=number],input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
</style>

<div id="hub"></div>
<div id="site" class="site" hidden></div>

    '</tbody></table></div>';

    '<label class="field" for="za-u"><span>住戸</span><select id="za-u" name="u">'+[1,2,3,4,5,6].map(function(n){return '<option>'+Z.floor+'0'+n+'号室</option>';}).join('')+'</select></label>' +
    '<label class="field" for="za-p"><span>部位</span><input type="text" id="za-p" name="p" required placeholder="例：洋室1 床"></label></div><div class="row">' +
    '<label class="field" for="za-d"><span>指摘</span><input type="text" id="za-d" name="d" required placeholder="例：巾木の浮き"></label>' +
    '<label class="field" for="za-c"><span>担当（協力会社）</span><select id="za-c" name="c">'+CO.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></label></div>' +
    '<div class="row" style="align-items:center"><div style="flex:0 0 auto"><button class="btn" type="submit">登録する</button></div><span class="small muted">実際の画面では、その場で写真を撮って添付できます。</span></div></form>';
  return h;
}
function nippo(){
  var h = '<div class="s-head"><h2>日報・KY</h2><span class="small muted">現場のスマホから入力し、事務所ですぐ確認できます</span></div><div class="nip">' +
    '<div class="phone"><div class="ph-top">日報・KY　｜　'+esc(me())+'</div><form class="card" id="nippo-form" style="margin-top:0">' +
    '<div class="row"><label class="field" for="np-date"><span>日付</span><input type="text" id="np-date" name="date" value="11/5"></label>' +
    '<label class="field" for="np-wx"><span>天気</span><select id="np-wx" name="wx"><option>晴れ</option><option>くもり</option><option>雨</option></select></label></div>' +
    '<label class="field" for="np-site"><span>工事名</span><select id="np-site" name="site"><option>〇〇マンション新築工事</option><option>〇〇小学校 体育館改修</option></select></label>' +
    '<label class="field" for="np-work"><span>今日の作業</span><textarea id="np-work" name="work" required placeholder="例：5階 内装仕上げ、6階 是正の確認"></textarea></label>' +
    '<label class="field" for="np-n"><span>作業員数</span><input type="number" id="np-n" name="n" min="0" value="12"></label>' +
    '<label class="field" for="np-ky"><span>KY（危ないところと対策）</span><textarea id="np-ky" name="ky" required placeholder="例：開口部まわり → 養生と立入禁止の表示を確認"></textarea></label>' +
    '<div><button class="btn" type="submit">送信する</button></div></form></div>' +
    '<div style="min-width:0"><h3 style="font-size:16px;margin-bottom:8px">事務所で見る一覧</h3><div class="feed">' +
    N.list.slice().reverse().map(function(r){ return '<article class="post"><div class="meta"><span class="num">'+esc(r.date)+'</span><span>'+esc(r.site)+'</span><span>'+esc(r.wx)+'</span><span>'+esc(r.by)+'</span><span class="num">作業員 '+esc(r.n)+'名</span></div><p>'+esc(r.work)+'</p><p class="small"><span class="pill p-mid">KY</span> '+esc(r.ky)+'</p></article>'; }).join('') +
    '</div></div></div>';
  return h;
}
function renderSite(){
  var tabs=[["zesei","是正記録"],["nippo","日報・KY"]];
  $("#site").innerHTML = '<div class="wrap"><section class="hero" style="padding-bottom:0"><p class="eyebrow">FIELD APP（試作）</p><h1>現場アプリ</h1><p class="parties">プロジェクトハブで受けたご要望から作った試作です。使ってみた声をハブに書くと、ここが直っていきます。</p></section>' +
    '<div class="s-tabs" role="tablist">'+tabs.map(function(t){return '<button type="button" role="tab" data-stab="'+t[0]+'" aria-selected="'+(Z.tab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>' +
    (Z.tab==="zesei"?zesei():nippo()) + '</div><footer class="hubfoot">サンプル建設株式会社 様　現場アプリ（試作）　｜　構築・保守：株式会社ベアシステム</footer>';
}

/* ---------------- 切り替え・操作 ---------------- */
function setView(v){
  S.view=v; $("#hub").hidden = v!=="hub"; $("#site").hidden = v!=="site";
  $("#sw-hub").setAttribute("aria-pressed", v==="hub"); $("#sw-site").setAttribute("aria-pressed", v==="site");
  if(v==="site") renderSite(); else renderHub();
  try{ history.replaceState(null,"","#"+v); }catch(e){}
  window.scrollTo(0,0);
}
document.addEventListener("click", function(e){
  var t = e.target.closest("button"); if(!t) return;
  if(t.dataset.view){ setView(t.dataset.view); return; }
  if(t.dataset.app!=null){ var a=S.apps[+t.dataset.app]; if(!a.tab){ toast("「"+a.title+"」は準備中です。ご要望が固まったところから作り始めます。"); return; } Z.tab=a.tab; setView("site"); return; }
  if(t.dataset.dept){ S.page="dept"; S.dept=t.dataset.dept; renderHub(); window.scrollTo(0,0); return; }
  if(t.dataset.act==="home"){ S.page="home"; renderHub(); window.scrollTo(0,0); return; }
  if(t.dataset.act==="add-dept"){ var n=S.depts.length+1; S.depts.push({id:"new"+n,name:"新しい部門（例：アフターサービス）",contact:"未定",status:"準備中",next:"日程調整中",progress:0}); renderHub(); toast("部門を追加しました。決まったところから順に増やせます。"); return; }
  if(t.dataset.done!=null){ S.tasks[+t.dataset.done].done=true; renderHub(); toast("完了にしました。"); return; }
  if(t.dataset.fix!=null){ S.wishes[+t.dataset.fix].fixed=true; renderHub(); toast("「確定」にしました。ベアシステムが優先して進めます。"); return; }
  if(t.dataset.approve!=null){ var u=S.pending.splice(+t.dataset.approve,1)[0]; S.users++; renderHub(); toast(u.name+"を承認しました。ご本人に承認メールを送ります（デモのため実際には送信しません）。"); return; }
  if(t.dataset.act==="csv"){ toast("名簿の方へ登録案内メールを送ります。登録すると名簿の部門・役割で自動的に利用中になります（デモ）。"); return; }
  if(t.hasAttribute("data-doc")){ toast("デモのため資料は開けません。実際の画面ではここから閲覧できます。"); return; }
  if(t.dataset.copy){ var txt=t.dataset.copy; try{ navigator.clipboard.writeText(txt).then(function(){toast("コピーしました");},function(){toast(txt);}); }catch(err){ toast(txt); } return; }
  if(t.dataset.stab){ Z.tab=t.dataset.stab; renderSite(); return; }
});
document.addEventListener("change", function(e){
  var el=e.target;
  if(el.id==="role"){ S.role=el.value; if(S.view==="hub") renderHub(); else renderSite(); toast("「"+el.options[el.selectedIndex].text+"」の表示に切り替えました。"); }
  if(el.id==="showdone"){ S.showDone=el.checked; renderHub(); }
  if(el.id==="zfloor"){ Z.floor=el.value; renderSite(); }
  if(el.id==="zco"){ Z.co=el.value; renderSite(); }
  if(el.dataset && el.dataset.zi!=null){ var r=Z.rows[+el.dataset.zi]; r.s=el.value; renderSite();
    toast(r.s==="依頼済み" ? r.c+"の担当者のスマホに是正の依頼を送ります（デモ）。" : r.s==="是正済み" ? r.u+"の「"+r.d+"」を是正済みにしました。完了写真が台帳に残ります。" : "状況を「"+r.s+"」にしました。"); }
});
document.addEventListener("submit", function(e){
  e.preventDefault();
  var f=e.target;
  if(f.id==="post-form"){
    var fd=new FormData(f); var dept=f.dataset.dept;
    S.posts.push({dept:dept, kind:fd.get("kind")||"post", author:fd.get("author"), title:fd.get("title"), body:fd.get("body"), at:now()});
    renderHub();
    toast((dept==="all"?"全体の掲示板":deptName(dept)+"の掲示板")+"に書き込みました。通知をオンにしている方にメールでお知らせします（デモのため実際には送信しません）。");
  }
  if(f.id==="wish-form"){
    var w=new FormData(f); var want=+w.get("want");
    S.wishes.push({dept:S.dept, title:w.get("title"), pr:w.get("pr"), fixed:false, status:"受付", plan:[Math.min(want,5),Math.min(want+1,5)], want:want, by:me().split(" ").pop()});
    renderHub(); toast("登録しました。全体の「やりたいこと」一覧とスケジュールに追加されています。");
  }
  if(f.id==="ask"){ f.reset(); toast("ご相談を受け付けました。ベアシステムからご連絡します（デモ）。"); }
  if(f.id==="zadd"){ var z=new FormData(f); Z.rows.push({f:Z.floor,u:z.get("u"),p:z.get("p"),d:z.get("d"),c:z.get("c"),s:"未依頼",ph:false}); Z.co=""; renderSite(); toast("指摘を登録しました。「依頼済み」にすると協力会社に届きます。"); }
  if(f.id==="nippo-form"){ var n=new FormData(f); N.list.push({date:n.get("date"),site:n.get("site"),wx:n.get("wx"),work:n.get("work"),n:n.get("n"),ky:n.get("ky"),by:me().split(" ").pop()}); renderSite(); toast("日報を送信しました。事務所の一覧にすぐ並びます。"); }
});

renderHub();
var h0 = (location.hash||"").replace("#","");
if(h0==="site") setView("site");
})();
</script>

</body></html>
