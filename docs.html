<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書類作成ツール｜株式会社ベアシステム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;font-size:14px;background:#f0f2f5;color:#333}
.layout{display:flex;min-height:100vh}
.sidebar{width:260px;min-width:260px;background:#1a2744;color:#fff;display:flex;flex-direction:column}
.sidebar-header{padding:16px 14px 12px;border-bottom:1px solid rgba(255,255,255,0.1)}
.sidebar-header h2{font-size:13px;font-weight:700;color:#7eb3ff;margin-bottom:2px}
.sidebar-header p{font-size:11px;color:rgba(255,255,255,0.5)}
.sidebar-body{flex:1;overflow-y:auto;padding:10px 8px}
.sidebar-new{width:100%;padding:8px;background:#1a56b0;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:10px}
.sidebar-new:hover{background:#1342a0}
.doc-list-item{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.doc-list-item:hover{background:rgba(255,255,255,0.08)}
.doc-list-item.active{background:rgba(30,86,176,0.4);border-color:#1a56b0}
.doc-list-item .dli-no{font-size:10px;color:#7eb3ff;margin-bottom:2px}
.doc-list-item .dli-cust{font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-list-item .dli-date{font-size:10px;color:rgba(255,255,255,0.45)}
.doc-list-item .dli-del{float:right;background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:14px;padding:0 2px;margin-top:-2px}
.doc-list-item .dli-del:hover{color:#ff6b6b}
.sidebar-footer{padding:10px 14px;border-top:1px solid rgba(255,255,255,0.1)}
.logout-btn{width:100%;padding:6px;background:transparent;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.2);border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit}
.logout-btn:hover{background:rgba(255,255,255,0.08)}
.main{flex:1;padding:16px;overflow-y:auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top-bar h1{font-size:14px;font-weight:700;color:#1a56b0}
.save-btn{padding:7px 20px;background:#2e7d32;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
.save-btn:hover{background:#1b5e20}
.tabs{display:flex;gap:4px}
.tab{padding:8px 24px;border:1px solid #ccc;background:#f0f0f0;cursor:pointer;border-radius:6px 6px 0 0;font-size:13px;color:#666;border-bottom:none}
.tab.active{background:#fff;color:#1a56b0;font-weight:600}
.panel{background:#fff;border-radius:0 8px 8px 8px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-bottom:16px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;color:#666;font-weight:500}
input,textarea{border:1px solid #ddd;border-radius:4px;padding:6px 10px;font-size:13px;font-family:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:#1a56b0}
input[readonly]{background:#f5f7fa;color:#555;cursor:default}
textarea{resize:vertical}
.section-title{font-size:13px;font-weight:600;color:#1a56b0;border-bottom:1px solid #e0e8f5;padding-bottom:6px;margin:16px 0 12px}
.fixed-badge{font-size:10px;background:#e8f0fe;color:#1a56b0;padding:2px 6px;border-radius:3px;margin-left:6px}
.linked-badge{font-size:10px;background:#e8f5e8;color:#2e7d32;padding:2px 6px;border-radius:3px;margin-left:6px}

/* プランカード */
.plan-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.plan-card{border:1px solid #ddd;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.plan-card.selected{border:2px solid #1a56b0;background:#f0f4ff}
.plan-card-check{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1}
.plan-card-check:hover .plan-name{color:#1342a0}
.plan-name{font-size:13px;font-weight:700;color:#1a56b0}
.plan-nick{font-size:11px;color:#e07b00;font-weight:600;margin:1px 0}
.plan-price-disp{font-size:13px;font-weight:600;color:#333}
/* 年額/月額トグル */
.billing-toggle{display:flex;border:1px solid #ccc;border-radius:5px;overflow:hidden;margin-left:auto;flex-shrink:0}
.billing-toggle button{padding:4px 10px;font-size:11px;border:none;background:#f5f5f5;color:#666;cursor:pointer;font-family:inherit;transition:all 0.15s}
.billing-toggle button.active{background:#1a56b0;color:#fff}
.plan-card-none{border:1px solid #ddd;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.plan-card-none:hover{background:#f8f8f8}
.plan-card-none.selected{border:2px solid #555;background:#f5f5f5}

/* 明細 */
table.items{width:100%;border-collapse:collapse;margin-bottom:8px}
table.items th{background:#f0f4fa;font-size:12px;padding:8px;text-align:left;border:1px solid #ddd}
table.items td{padding:6px 4px;border:1px solid #eee;vertical-align:middle}
table.items td input{border:none;padding:4px 6px;background:transparent;width:100%}
table.items td input:focus{background:#f0f4fa;outline:none}
.col-no{width:36px;text-align:center}.col-qty{width:70px}.col-unit{width:60px}.col-price{width:120px}.col-sub{width:110px;background:#fafafa}.col-del{width:32px}
.btn-add{font-size:12px;padding:5px 14px;border:1px dashed #1a56b0;background:#f0f4fa;color:#1a56b0;border-radius:4px;cursor:pointer;margin-bottom:12px}
.totals{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-bottom:16px}
.total-row{display:flex;gap:12px;font-size:13px}
.total-row.grand{font-size:15px;font-weight:700;color:#1a56b0;border-top:1px solid #ccc;padding-top:6px;margin-top:4px}
.total-label{min-width:160px;text-align:right;color:#666}
.total-val{min-width:120px;text-align:right}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;border:none}
.btn-preview{background:#fff;border:1px solid #1a56b0;color:#1a56b0}.btn-preview:hover{background:#f0f4fa}
.btn-pdf{background:#1a56b0;color:#fff}.btn-pdf:hover{background:#1342a0}
.btn-clear{background:#fff;border:1px solid #ccc;color:#666}
.del-btn{background:none;border:none;color:#cc4444;cursor:pointer;font-size:16px;padding:0 6px}
.info-box{background:#fffbe6;border:1px solid #ffe58f;border-radius:6px;padding:10px 14px;font-size:12px;color:#7c5800;margin-bottom:14px}
.bank-box{background:#f5f7fa;border:1px solid #ddd;border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:16px;color:#444;line-height:2}
.empty-list{font-size:11px;color:rgba(255,255,255,0.35);text-align:center;padding:20px 0}
#login-screen{position:fixed;inset:0;background:#f0f4ff;display:flex;align-items:center;justify-content:center;z-index:200}
</style>
</head>
<body>

<!-- ログイン -->
<div id="login-screen">
  <div style="background:#fff;border-radius:12px;padding:40px 48px;box-shadow:0 4px 24px rgba(0,0,0,0.12);width:340px;text-align:center">
    <div style="font-size:22px;font-weight:700;color:#1a56b0;letter-spacing:1px;margin-bottom:4px">株式会社ベアシステム</div>
    <div style="font-size:13px;color:#888;margin-bottom:24px">書類作成ツール</div>
    <div style="margin-bottom:16px;text-align:left">
      <label style="font-size:12px;color:#666;font-weight:500">パスワード</label>
      <input id="login-pw" type="password" placeholder="パスワードを入力" style="width:100%;border:1px solid #ddd;border-radius:6px;padding:10px 12px;font-size:14px;margin-top:4px;font-family:inherit" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" style="display:none;color:#cc3333;font-size:12px;margin-bottom:10px">パスワードが正しくありません</div>
    <button onclick="doLogin()" style="width:100%;background:#1a56b0;color:#fff;border:none;border-radius:6px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">ログイン</button>
  </div>
</div>

<!-- メイン -->
<div class="layout" id="main-app" style="display:none">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>書類作成ツール</h2>
      <p>株式会社ベアシステム</p>
    </div>
    <div class="sidebar-body">
      <button class="sidebar-new" onclick="newDocument()">＋ 新規作成</button>
      <div id="doc-list"><div class="empty-list">保存済み書類はありません</div></div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="doLogout()">ログアウト</button>
    </div>
  </div>

  <div class="main">
    <div class="top-bar">
      <h1 id="current-doc-label">新規書類</h1>
      <button class="save-btn" onclick="saveDoc()">💾 保存</button>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('estimate')">見積書</div>
      <div class="tab" onclick="switchTab('contract')">契約書</div>
      <div class="tab" onclick="switchTab('invoice')">請求書</div>
    </div>
    <div class="panel">
      <div class="section-title">自社情報 <span class="fixed-badge">固定</span></div>
      <div class="form-grid">
        <div class="form-group"><label>会社名</label><input value="株式会社ベアシステム" readonly></div>
        <div class="form-group"><label>担当者名</label><input id="my-person" value="井上 俊"></div>
        <div class="form-group full"><label>住所</label><input value="東京都渋谷区円山町5−3 MIEUX渋谷ビル8階" readonly></div>
        <div class="form-group"><label>電話番号</label><input value="03-6367-2529" readonly></div>
        <div class="form-group"><label>メールアドレス</label><input id="my-email" value="info@bear-system.net"></div>
      </div>

      <div class="section-title" id="doc-section-title">見積書情報</div>
      <div id="estimate-info">
        <div class="form-grid">
          <div class="form-group"><label>書類番号</label><input id="est-no" readonly style="background:#f5f7fa;color:#555" placeholder="番号を発行してください"></div>
          <div class="form-group"><label>発行日</label><input id="est-date" type="date" oninput="onEstDateChange()"></div>
          <div class="form-group"><label>有効期限（修正可）</label><input id="est-expire" type="date"></div>
          <div class="form-group" style="justify-content:flex-end;padding-top:18px">
            <button id="issue-btn" onclick="issueNos()" style="padding:7px 16px;background:#1a56b0;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit">番号を発行</button>
          </div>
        </div>
      </div>
      <div id="contract-info" style="display:none">
        <div class="info-box">顧客情報・プラン・明細は見積書タブで編集してください。</div>
        <div class="form-grid">
          <div class="form-group"><label>書類番号</label><input id="con-no" readonly style="background:#f5f7fa;color:#555"></div>
          <div class="form-group"><label>発行日</label><input id="con-date" type="date"></div>
          <div class="form-group full"><label>契約期間</label><input id="con-period" placeholder="例: 2026年6月1日〜2027年5月31日"></div>
        </div>
        <div class="form-group full" style="margin-bottom:10px"><label>契約条項（修正可）</label><textarea id="con-body" rows="22"></textarea></div>
      </div>
      <div id="invoice-info" style="display:none">
        <div class="info-box">顧客情報・プラン・明細は見積書タブで編集してください。</div>
        <div class="form-grid">
          <div class="form-group"><label>書類番号</label><input id="inv-no" readonly style="background:#f5f7fa;color:#555"></div>
          <div class="form-group"><label>発行日</label><input id="inv-date" type="date"></div>
          <div class="form-group"><label>支払期限</label><input id="inv-payment" type="date"></div>
          <div class="form-group"></div>
        </div>
      </div>

      <div class="section-title">顧客情報 <span id="linked-badge-cust" style="display:none" class="linked-badge">見積書から連動</span></div>
      <div class="form-grid">
        <div class="form-group"><label>会社名</label><input id="cust-company" placeholder="株式会社〇〇"></div>
        <div class="form-group"><label>担当者名</label><input id="cust-person" placeholder="〇〇 様"></div>
        <div class="form-group full"><label>住所</label><input id="cust-address" placeholder="東京都〇〇区…"></div>
      </div>

      <div id="plan-section">
        <div class="section-title">契約プラン <span id="linked-badge-plan" style="display:none" class="linked-badge">見積書から連動</span></div>
        <div class="plan-cards" id="plan-cards-wrap">
          <!-- JS で描画 -->
        </div>
      </div>

      <div id="items-section">
        <div class="section-title">追加明細・スポット <span id="linked-badge-items" style="display:none" class="linked-badge">見積書から連動</span></div>
        <table class="items">
          <thead><tr>
            <th class="col-no">No</th><th>品目・内容</th>
            <th class="col-qty">数量</th><th class="col-unit">単位</th>
            <th class="col-price">単価（円）</th><th class="col-sub">小計（円）</th>
            <th class="col-del"></th>
          </tr></thead>
          <tbody id="items-body"></tbody>
        </table>
        <div id="add-row-btn-wrap"><button class="btn-add" onclick="addRow()">＋ 行を追加</button></div>
        <div class="totals" id="totals"></div>
      </div>

      <div id="bank-section" style="display:none">
        <div class="section-title">振込先 <span class="fixed-badge">固定</span></div>
        <div class="bank-box">みずほ銀行 渋谷支店（210）<br>普通　3316122<br>株式会社ベアシステム</div>
      </div>

      <div class="section-title">備考</div>
      <div class="form-group full" style="margin-bottom:16px"><textarea id="doc-notes" rows="3" placeholder="支払条件、特記事項など"></textarea></div>

      <div class="actions">
        <button class="btn btn-clear" onclick="newDocument()">クリア / 新規</button>
        <button class="btn btn-preview" onclick="showPreview()">プレビュー</button>
        <button class="btn btn-pdf" onclick="printPDF()">印刷 / PDF保存</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:center;justify-content:center" onclick="closeModal(event)">
  <div style="background:#fff;border-radius:8px;width:720px;max-height:92vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.18)">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff">
      <span style="font-size:14px;font-weight:600">プレビュー</span>
      <button onclick="document.getElementById('modal-overlay').style.display='none'" style="background:none;border:none;font-size:22px;cursor:pointer;color:#666">×</button>
    </div>
    <div style="padding:32px 40px" id="preview-content"></div>
  </div>
</div>
<canvas id="stamp-canvas" style="display:none"></canvas>

<script>
// ====================================
// 設定
// ====================================
var APP_PASSWORD = '2529';
var FB_BASE = 'https://bear-system-docs-default-rtdb.asia-southeast1.firebasedatabase.app';
var FB_NOS  = FB_BASE + '/docNos';
var FB_DOCS = FB_BASE + '/docs';

var BANK = 'みずほ銀行 渋谷支店（210）\n普通　3316122\n株式会社ベアシステム';
var MY   = {company:'株式会社ベアシステム',address:'東京都渋谷区円山町5−3 MIEUX渋谷ビル8階',tel:'03-6367-2529'};

// プラン定義（年額）
var PLANS = [
  {name:'IT／DX推進室プラン',       nick:'どぎゃしこでんあっですプラン', yearPrice:4000000, monthPrice:400000},
  {name:'カスタムAIエージェント構築プラン', nick:'むしゃんよかプラン',          yearPrice:2000000, monthPrice:200000},
  {name:'ITツール定着・活用プラン',   nick:'たいぎゃよかプラン',          yearPrice:1000000, monthPrice:100000}
];

// 状態
// planStates[i] = {checked: bool, billing: 'year'|'month'}
var planStates = [{checked:false,billing:'year'},{checked:false,billing:'year'},{checked:false,billing:'year'}];
var noneChecked = false;
var currentTab = 'estimate';
var rows = [];
var currentDocId = null;

// ====================================
// ユーティリティ
// ====================================
function today(){return new Date().toISOString().split('T')[0];}
function addDays(d,n){var dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0];}
function fmtDate(s){if(!s)return '';var p=s.split('-');return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日';}
function fmt(n){if(n<0)return '▲'+Math.abs(Math.round(n)).toLocaleString('ja-JP');return Math.round(n).toLocaleString('ja-JP');}
function g(id){var el=document.getElementById(id);return el?el.value:'';}
function sv(id,v){var el=document.getElementById(id);if(el)el.value=v;}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function fmtInput(n){return n?fmt(n):'';}

function planPrice(i){
  return planStates[i].billing==='month'
    ? PLANS[i].monthPrice
    : PLANS[i].yearPrice;
}
function planUnit(i){return planStates[i].billing==='month'?'月':'年';}

// ====================================
// ログイン
// ====================================
function checkLogin(){return sessionStorage.getItem('bs_auth')==='1';}
function doLogin(){
  var pw=document.getElementById('login-pw').value;
  if(pw===APP_PASSWORD){
    sessionStorage.setItem('bs_auth','1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-app').style.display='flex';
    initApp();
  } else {
    document.getElementById('login-err').style.display='block';
    document.getElementById('login-pw').value='';
    document.getElementById('login-pw').focus();
  }
}
function doLogout(){
  sessionStorage.removeItem('bs_auth');
  document.getElementById('main-app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-pw').value='';
  document.getElementById('login-err').style.display='none';
}
window.onload=function(){
  if(checkLogin()){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('main-app').style.display='flex';
    initApp();
  }
};

// ====================================
// Firebase 連番
// ====================================
function getNextNo(prefix,ym){
  return new Promise(function(resolve){
    var url=FB_NOS+'/'+prefix+'/'+ym+'.json';
    fetch(url).then(function(r){return r.json();}).then(function(cur){
      var next=(cur&&typeof cur==='number'?cur:0)+1;
      return fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(next)}).then(function(){return next;});
    }).then(function(n){resolve(n);}).catch(function(){resolve(1);});
  });
}
function getYM(){var d=g('est-date')||today();var p=d.split('-');return p[0]+'-'+p[1];}
function padNo(n){return n<10?'00'+n:n<100?'0'+n:String(n);}
function issueNos(){
  var ym=getYM();
  var btn=document.getElementById('issue-btn');
  btn.textContent='発行中...';btn.disabled=true;
  Promise.all([getNextNo('EST',ym),getNextNo('CON',ym),getNextNo('INV',ym)]).then(function(vals){
    sv('est-no','EST'+ym+'-'+padNo(vals[0]));
    sv('con-no','CON'+ym+'-'+padNo(vals[1]));
    sv('inv-no','INV'+ym+'-'+padNo(vals[2]));
    btn.textContent='番号を発行';btn.disabled=false;
  }).catch(function(){btn.textContent='番号を発行';btn.disabled=false;});
}
function onEstDateChange(){var d=g('est-date');if(d)sv('est-expire',addDays(d,14));}

// ====================================
// プランカード描画
// ====================================
function renderPlanCards(){
  var isEst = currentTab==='estimate';
  var html='';
  for(var i=0;i<3;i++){
    var ps=planStates[i];
    var p=PLANS[i];
    var price=planPrice(i);
    var unit=planUnit(i);
    var sel=ps.checked;
    html+='<div class="plan-card'+(sel?' selected':'')+'" id="pc-'+i+'">';
    html+='<div class="plan-card-check" onclick="'+(isEst?'togglePlan('+i+')':'')+'">';
    html+='<input type="checkbox" '+(sel?'checked':'')+' '+(isEst?'':'disabled')+' onclick="event.stopPropagation();'+(isEst?'togglePlan('+i+')':'')+'" style="width:16px;height:16px;flex-shrink:0;accent-color:#1a56b0;cursor:'+(isEst?'pointer':'default')+'">';
    html+='<div><div class="plan-name">'+p.name+'</div><div class="plan-nick">【'+p.nick+'】</div>';
    html+='<div class="plan-price-disp">'+fmt(price)+' 円／'+unit+'</div></div></div>';
    // 年額/月額トグル
    html+='<div class="billing-toggle">';
    html+='<button class="'+(ps.billing==='year'?'active':'')+'" onclick="'+(isEst?'setBilling('+i+',\'year\')':'')+'" '+(isEst?'':'disabled')+'>年額</button>';

// ====================================
// Firebase 保存・読込・削除
// ====================================
function saveDoc(){
  var btn=document.querySelector('.save-btn');
  btn.textContent='保存中...';btn.disabled=true;
  var data=getFormState();data.savedAt=new Date().toISOString();
  var url=currentDocId?FB_DOCS+'/'+currentDocId+'.json':FB_DOCS+'.json';
  var method=currentDocId?'PUT':'POST';
  fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(function(r){return r.json();})
    .then(function(res){
      if(!currentDocId&&res.name)currentDocId=res.name;
      btn.textContent='💾 保存';btn.disabled=false;
      loadDocList();updateCurrentLabel();
    }).catch(function(){btn.textContent='💾 保存';btn.disabled=false;alert('保存に失敗しました。');});
}

function loadDocList(){
  fetch(FB_DOCS+'.json').then(function(r){return r.json();}).then(function(data){
    var list=document.getElementById('doc-list');
    if(!data){list.innerHTML='<div class="empty-list">保存済み書類はありません</div>';return;}
    var items=[];
    Object.keys(data).forEach(function(k){items.push({id:k,data:data[k]});});
    items.sort(function(a,b){return(b.data.savedAt||'').localeCompare(a.data.savedAt||'');});
    list.innerHTML=items.map(function(item){
      var d=item.data;
      var isActive=item.id===currentDocId;
      return '<div class="doc-list-item'+(isActive?' active':'')+'" onclick="loadDoc(\''+item.id+'\')">'+
        '<button class="dli-del" onclick="event.stopPropagation();deleteDoc(\''+item.id+'\')" title="削除">×</button>'+
        '<div class="dli-no">'+(d.estNo||'番号未発行')+'</div>'+
        '<div class="dli-cust">'+esc(d.custCompany||'（顧客名未入力）')+'</div>'+
        '<div class="dli-date">'+(d.estDate?fmtDate(d.estDate):'')+'</div></div>';
    }).join('');
  }).catch(function(){});
}

function loadDoc(id){
  fetch(FB_DOCS+'/'+id+'.json').then(function(r){return r.json();}).then(function(data){
    if(!data)return;
    currentDocId=id;
    restoreFormState(data);
    loadDocList();updateCurrentLabel();switchTab('estimate');
  });
}

function deleteDoc(id){
  if(!confirm('この書類を削除しますか？'))return;
  fetch(FB_DOCS+'/'+id+'.json',{method:'DELETE'}).then(function(){
    if(currentDocId===id)newDocument();else loadDocList();
  });
}

function addRow(){rows.push({id:Date.now()+Math.random(),item:'',qty:1,unit:'式',price:0});renderRows();}
function removeRow(id){rows=rows.filter(function(r){return r.id!==id;});renderRows();}
function onPriceInput(el,i){var raw=el.value.replace(/[^\d\-]/g,'');var neg=raw.charAt(0)==='-';var num=raw.replace(/-/g,'');rows[i].price=num?(neg?-parseInt(num):parseInt(num)):0;renderTotals();}
function onPriceBlur(el,i){el.value=rows[i].price!==0?fmt(rows[i].price):'';}

function renderRows(){
  var ro=currentTab!=='estimate';
  var tbody=document.getElementById('items-body');if(!tbody)return;
  var html='';
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    html+='<tr>'+
      '<td class="col-no" style="text-align:center;color:#888;font-size:12px">'+(i+1)+'</td>'+
      '<td><input value="'+esc(r.item)+'" '+(ro?'readonly style="background:#f5f7fa"':'')+' oninput="rows['+i+'].item=this.value" placeholder="品目・内容"></td>'+
      '<td class="col-qty"><input type="number" value="'+r.qty+'" min="0" '+(ro?'readonly style="background:#f5f7fa;text-align:right"':'style="text-align:right"')+' oninput="rows['+i+'].qty=parseFloat(this.value)||0;renderRows()"></td>'+
      '<td class="col-unit"><input value="'+esc(r.unit)+'" '+(ro?'readonly style="background:#f5f7fa;text-align:center"':'style="text-align:center"')+' oninput="rows['+i+'].unit=this.value"></td>'+
      '<td class="col-price"><input type="text" value="'+fmtInput(r.price)+'" '+(ro?'readonly style="background:#f5f7fa;text-align:right"':'style="text-align:right"')+' oninput="onPriceInput(this,'+i+')" onblur="onPriceBlur(this,'+i+')"></td>'+
      '<td class="col-sub" style="text-align:right;font-size:12px;padding:0 8px;background:#fafafa">'+fmt(r.qty*r.price)+'</td>'+
      '<td class="col-del">'+(!ro?'<button class="del-btn" onclick="removeRow('+r.id+')">×</button>':'')+'</td>'+
      '</tr>';
  }
  tbody.innerHTML=html;renderTotals();
}

function renderTotals(){
  var planSub=0;
  var html='';
  for(var i=0;i<3;i++){
    if(planStates[i].checked){
      var pr=planPrice(i);var pu=planUnit(i);
      planSub+=pr;
      html+='<div class="total-row" style="font-size:12px;color:#555"><span class="total-label">'+PLANS[i].name+'（'+pu+'額）</span><span class="total-val">'+fmt(pr)+' 円</span></div>';
    }
  }
  var rowSub=0;for(var j=0;j<rows.length;j++)rowSub+=rows[j].qty*rows[j].price;
  var sub=planSub+rowSub;var tax=Math.floor(sub*0.1);
  if(rowSub!==0)html+='<div class="total-row" style="font-size:12px;color:#555"><span class="total-label">追加明細・スポット 小計</span><span class="total-val">'+fmt(rowSub)+' 円</span></div>';
  html+='<div class="total-row"><span class="total-label">小計</span><span class="total-val">'+fmt(sub)+' 円</span></div>'+
    '<div class="total-row"><span class="total-label">消費税（10%）</span><span class="total-val">'+fmt(tax)+' 円</span></div>'+
    '<div class="total-row grand"><span class="total-label">合計金額</span><span class="total-val">'+fmt(sub+tax)+' 円</span></div>';
  document.getElementById('totals').innerHTML=html;
}

function calcTotals(){
  var planSub=0;for(var i=0;i<3;i++){if(planStates[i].checked)planSub+=planPrice(i);}
  var rowSub=0;for(var j=0;j<rows.length;j++)rowSub+=rows[j].qty*rows[j].price;
  var sub=planSub+rowSub;return{sub:sub,tax:Math.floor(sub*0.1),total:sub+Math.floor(sub*0.1)};
}

function getDocData(){
  var t=calcTotals();
  var noKey={estimate:'est-no',contract:'con-no',invoice:'inv-no'};
  var dtKey={estimate:'est-date',contract:'con-date',invoice:'inv-date'};
  var labels={estimate:'見積書',contract:'契約書 兼 サービス利用申込書',invoice:'請求書'};
  var selPlans=[];
  for(var i=0;i<3;i++){if(planStates[i].checked)selPlans.push({name:PLANS[i].name,nick:PLANS[i].nick,price:planPrice(i),unit:planUnit(i),billing:planStates[i].billing});}
  var rr=[];for(var j=0;j<rows.length;j++){if(rows[j].item||rows[j].price!==0)rr.push({item:rows[j].item,qty:rows[j].qty,unit:rows[j].unit,price:rows[j].price,subtotal:rows[j].qty*rows[j].price});}
  return{type:currentTab,label:labels[currentTab],no:g(noKey[currentTab]),date:g(dtKey[currentTab]),expire:g('est-expire'),payment:g('inv-payment'),contractPeriod:g('con-period'),contractBody:g('con-body'),myCompany:MY.company,myAddress:MY.address,myTel:MY.tel,myPerson:g('my-person'),myEmail:g('my-email'),custCompany:g('cust-company'),custPerson:g('cust-person'),custAddress:g('cust-address'),notes:g('doc-notes'),plans:selPlans,rows:rr,sub:t.sub,tax:t.tax,total:t.total};
}

// ====================================
// 角印
// ====================================
function makeStamp(size){
  var c=document.getElementById('stamp-canvas');c.width=size;c.height=size;
  var ctx=c.getContext('2d');ctx.clearRect(0,0,size,size);
  var clr='rgba(160,10,10,1)';var pad=size*0.045,rad=size*0.055;
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
  rr(pad,pad,size-pad*2,size-pad*2,rad);ctx.fillStyle='rgba(180,15,15,0.07)';ctx.fill();
  rr(pad,pad,size-pad*2,size-pad*2,rad);ctx.strokeStyle=clr;ctx.lineWidth=size*0.07;ctx.stroke();
  var mg=pad+size*0.08,aH=size-mg*2,aW=size-mg*2;
  var lines=['テム之印','ベアシス','株式会社'];var colW=aW/3;
  ctx.fillStyle=clr;ctx.textAlign='center';ctx.textBaseline='middle';
  for(var col=0;col<lines.length;col++){
    var chars=lines[col].split('');var fs=Math.floor(Math.min(colW*0.98,aH/chars.length*0.99));
    ctx.font='900 '+fs+'px "Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif';
    var stepH=aH/chars.length,cx=mg+colW*col+colW/2;
    for(var row=0;row<chars.length;row++){
      var cy=mg+stepH*row+stepH/2;ctx.save();ctx.translate(cx,cy);ctx.scale(1,1.1);
      ctx.shadowColor='rgba(130,5,5,0.4)';ctx.shadowBlur=size*0.018;ctx.strokeStyle=clr;ctx.lineWidth=fs*0.09;ctx.lineJoin='round';
      ctx.strokeText(chars[row],0,0);ctx.fillText(chars[row],0,0);ctx.restore();
    }
  }
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,0.4)';
  for(var i=0;i<260;i++){var rx=pad+(Math.abs(Math.sin(i*13.7))*0.88+0.06)*(size-pad*2);var ry=pad+(Math.abs(Math.cos(i*7.3))*0.88+0.06)*(size-pad*2);var rr2=(Math.abs(Math.sin(i*2.1))*0.5+0.2)*size*0.011;ctx.beginPath();ctx.arc(rx,ry,rr2,0,Math.PI*2);ctx.fill();}
  return c.toDataURL('image/png');
}

  if(d.type==='invoice')metaRight='支払期限：'+fmtDate(d.payment);
  if(d.type==='contract')metaRight='契約期間：'+(d.contractPeriod||'');
  var stampHTML=stampImg?'<img src="'+stampImg+'" style="width:68px;height:68px;opacity:0.88;display:block;flex-shrink:0;align-self:center">':'';
  function th(ex){return 'style="background:#1a56b0;color:#fff;padding:5px 7px;font-size:10px;'+(ex||'')+'"';}
  function makeTable(tb){return '<table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px"><thead><tr><th '+th('text-align:center;width:36px')+'>No</th><th '+th('text-align:left')+'>品目・内容</th><th '+th('text-align:right;width:50px')+'>数量</th><th '+th('text-align:center;width:44px')+'>単位</th><th '+th('text-align:right;width:90px')+'>単価（円）</th><th '+th('text-align:right;width:90px')+'>小計（円）</th></tr></thead><tbody>'+tb+'</tbody></table>';}
  function makeTotals(){return '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-bottom:12px;font-size:11px"><div style="display:flex;gap:8px"><span style="min-width:90px;text-align:right;color:#666">小計</span><span style="min-width:90px;text-align:right">¥'+fmt(d.sub)+'</span></div><div style="display:flex;gap:8px"><span style="min-width:90px;text-align:right;color:#666">消費税（10%）</span><span style="min-width:90px;text-align:right">¥'+fmt(d.tax)+'</span></div><div style="display:flex;gap:8px;border-top:1px solid #aaa;padding-top:4px;margin-top:2px"><span style="min-width:90px;text-align:right;font-weight:700;font-size:13px;color:#1a56b0">合計金額</span><span style="min-width:90px;text-align:right;font-weight:700;font-size:13px;color:#1a56b0">¥'+fmt(d.total)+'</span></div></div>';}
  var tr='';var rowNo=1;
  for(var pi=0;pi<d.plans.length;pi++){
    var pl=d.plans[pi];
    tr+='<tr style="background:#f0f4ff"><td style="padding:5px 7px;border-bottom:1px solid #ddd;text-align:center">'+rowNo+'</td>'+
      '<td style="padding:5px 7px;border-bottom:1px solid #ddd;font-weight:600">'+pl.name+'<span style="font-size:10px;color:#e07b00;margin-left:6px">'+pl.nick+'</span></td>'+
      '<td style="padding:5px 7px;border-bottom:1px solid #ddd;text-align:right">1</td>'+
      '<td style="padding:5px 7px;border-bottom:1px solid #ddd;text-align:center">'+pl.unit+'</td>'+
      '<td style="padding:5px 7px;border-bottom:1px solid #ddd;text-align:right">'+fmt(pl.price)+'</td>'+
      '<td style="padding:5px 7px;border-bottom:1px solid #ddd;text-align:right">'+fmt(pl.price)+'</td></tr>';
    rowNo++;
  }
  for(var i=0;i<d.rows.length;i++){var r=d.rows[i];var bg=rowNo%2===0?'#fafafa':'#fff';tr+='<tr style="background:'+bg+'"><td style="padding:5px 7px;border-bottom:1px solid #eee;text-align:center">'+rowNo+'</td><td style="padding:5px 7px;border-bottom:1px solid #eee">'+(r.item||'―')+'</td><td style="padding:5px 7px;border-bottom:1px solid #eee;text-align:right">'+r.qty+'</td><td style="padding:5px 7px;border-bottom:1px solid #eee;text-align:center">'+r.unit+'</td><td style="padding:5px 7px;border-bottom:1px solid #eee;text-align:right">'+fmt(r.price)+'</td><td style="padding:5px 7px;border-bottom:1px solid #eee;text-align:right">'+fmt(r.subtotal)+'</td></tr>';rowNo++;}
  var bodyHTML='';
  if(d.type==='contract'){bodyHTML=(tr?makeTable(tr)+makeTotals():'')+  '<div style="font-size:10.5px;line-height:1.85;white-space:pre-wrap;border:1px solid #ccc;padding:12px;border-radius:3px;margin-bottom:8px">'+(d.contractBody||'').replace(/</g,'&lt;')+'</div>';}
  else{bodyHTML=makeTable(tr)+makeTotals();}
  var bankHTML=d.type==='invoice'?'<div style="border:1px solid #ccc;border-radius:3px;padding:7px 9px;font-size:11px;margin-bottom:8px;line-height:1.8"><div style="font-size:9px;color:#888;margin-bottom:3px">振込先</div>'+BANK.replace(/\n/g,'<br>')+'</div>':'';
  var notesHTML=d.notes?'<div style="border:1px solid #ccc;border-radius:3px;padding:7px 9px;font-size:11px;margin-bottom:8px;line-height:1.8"><div style="font-size:9px;color:#888;margin-bottom:3px">備考</div>'+d.notes.replace(/\n/g,'<br>')+'</div>':'';
  return '<div style="background:#1a56b0;color:#fff;text-align:center;padding:8px;margin-bottom:10px;position:relative"><h1 style="font-size:18px;letter-spacing:4px;font-weight:700;margin:0">'+d.label+'</h1><span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:10px">'+d.no+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:8px"><span>発行日：'+fmtDate(d.date)+'</span><span>'+metaRight+'</span></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'+
    '<div style="border:1px solid #ccc;padding:8px 10px;font-size:11px"><div style="font-size:9px;color:#888;margin-bottom:3px">お客様</div><div style="font-size:13px;font-weight:700;margin-bottom:2px">'+(d.custCompany||'（顧客名未入力）')+' 御中</div>'+(d.custPerson?'<div style="font-size:10px;color:#444">'+d.custPerson+' 様</div>':'')+(d.custAddress?'<div style="font-size:10px;color:#444">'+d.custAddress+'</div>':'')+'</div>'+
    '<div style="border:1px solid #ccc;padding:8px 10px;font-size:11px;display:flex;gap:6px"><div style="flex:1"><div style="font-size:9px;color:#888;margin-bottom:3px">発行者</div><div style="font-size:13px;font-weight:700;margin-bottom:2px">'+d.myCompany+'</div><div style="font-size:10px;color:#444;line-height:1.6">'+d.myPerson+'</div><div style="font-size:10px;color:#444;line-height:1.6">'+d.myAddress+'</div><div style="font-size:10px;color:#444;line-height:1.6">'+d.myTel+'　'+d.myEmail+'</div></div><div style="display:flex;align-items:center">'+stampHTML+'</div></div></div>'+
    bodyHTML+bankHTML+notesHTML+
    '<div style="text-align:center;font-size:9px;color:#aaa;margin-top:16px;border-top:1px solid #eee;padding-top:6px">'+d.myCompany+' | '+d.myAddress+' | TEL: '+d.myTel+'</div>';
}

var PCSS='body{font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;margin:0;padding:20px;color:#222;font-size:12px}@page{size:A4;margin:15mm}@media print{body{padding:0}}';
function showPreview(){var d=getDocData();document.getElementById('preview-content').innerHTML=buildDocHTML(d,makeStamp(240));document.getElementById('modal-overlay').style.display='flex';}
function closeModal(e){if(e.target.id==='modal-overlay')document.getElementById('modal-overlay').style.display='none';}
function printPDF(){var d=getDocData();var html='<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>'+d.label+'_'+d.no+'</title><style>'+PCSS+'</style></head><body>'+buildDocHTML(d,makeStamp(240))+'<script>window.onload=function(){window.print();}<\/script></body></html>';var blob=new Blob([html],{type:'text/html'});var url=URL.createObjectURL(blob);var win=window.open(url,'_blank');if(!win)alert('ポップアップを許可してください。');}
</script>
